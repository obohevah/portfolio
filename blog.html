<body>

    <div class="container"> 
        <div id="blog-details">
            <h1 id="blog-title"></h1>
            <p id="blog-date"></p>
            <img id="blog-image" src="" alt="">
            <p id="blog-content"></p>
        </div>
    
        <!-- Comments Section -->
        <div class="comments-section">
            <h2>Leave a Comment</h2>
           
            <input type="text" id="username" class="comment-box" placeholder="Enter your name">
            <textarea id="commentInput" class="comment-box" placeholder="Write a comment..."></textarea>
            <button class="comment-button" name="submit" onclick="addComment()">Post Comment</button>
            
            <br><br>
    
            <h2>Previous Comments</h2>
            <div id="commentList"></div>  <!-- Main container for all comments -->
        </div>
        
        <a href="index.php" class="back-home">Back to Home ↗</a>
    </div>
    
    <script>
        // Get the blog slug from the URL
 console.log("🚀 Debugging Started...");

// Step 1: Check if slug is present in URL
const urlParams = new URLSearchParams(window.location.search);
const blogSlug = urlParams.get("slug");

console.log("Extracted Slug:", blogSlug);

if (!blogSlug) {
    console.error("❌ No blog slug found in URL!");
} else {
    console.log("✅ Blog Slug Found:", blogSlug);
}

// Step 2: Fetch blogs.json and check if it's loading
fetch("blogs.json")
    .then(response => response.json())
    .then(blogs => {
        console.log("✅ Blogs Loaded:", blogs);

        // Step 3: Check if the slug exists in blogs.json
        const blog = blogs.find(b => b.slug.trim().toLowerCase() === blogSlug.trim().toLowerCase());

        if (!blog) {
            console.error("❌ Blog not found in blogs.json!");
            return;
        }

        console.log("✅ Found Blog:", blog);
        
        // Step 4: Display blog content
        const blogTitle = document.getElementById("blog-title");
        const blogContent = document.getElementById("blog-content");

        if (!blogTitle || !blogContent) {
            console.error("❌ Error: Missing HTML elements for blog title/content!");
            return;
        }

        blogTitle.innerHTML = blog.title;
        blogContent.innerHTML = blog.content;
        console.log("✅ Blog content displayed successfully!");
    })
    .catch(error => console.error("❌ Error loading blogs.json:", error));


// ✅ Function to Load Comments
function loadComments() {
    fetch(`get_comments.php?blogSlug=${blogSlug}`)
        .then(response => response.json())
        .then(comments => {
            let commentList = document.getElementById("commentList");
            commentList.innerHTML = ""; // Clear previous comments
            comments.forEach(displayComment);
        })
        .catch(error => console.error("Error loading comments:", error));
}

// ✅ Function to Add a Comment
function addComment() {
    let username = document.getElementById("username").value.trim();
    let commentText = document.getElementById("commentInput").value.trim();

    if (!username || !commentText) {
        alert("Please enter your name and comment.");
        return;
    }

    if (!blogSlug) {
        console.error("Blog slug is missing!");
        return;
    }

    let commentData = {
        blogSlug: blogSlug,
        username: username,
        commentText: commentText,
        parent_id: null
    };

    console.log("Sending data:", commentData);

    fetch("save_comment.php", {
        method: "POST",
        body: JSON.stringify(commentData),
        headers: { "Content-Type": "application/json" }
    })
    .then(response => response.json())
    .then(data => {
        console.log("Server response:", data);
        if (data.status === "success") {
            displayComment({ id: data.id, username: username, commentText: commentText, parent_id: null });
            document.getElementById("username").value = "";
            document.getElementById("commentInput").value = "";
        } else {
            alert("Error: " + data.message);
        }
    })
    .catch(error => console.error("Error saving comment:", error));
}

// ✅ Function to Reply to a Comment
function replyToComment(commentId) {
    let replyText = prompt("Enter your reply:");
    if (!replyText) return;

    let commentData = {
        blogSlug: blogSlug,
        username: "Response",
        commentText: replyText,
        parent_id: commentId
    };

    fetch("save_comment.php", {
        method: "POST",
        body: JSON.stringify(commentData),
        headers: { "Content-Type": "application/json" }
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === "success") {
            displayComment({ id: data.id, username: commentData.username, commentText: replyText, parent_id: commentId });
        } else {
            alert("Error: " + data.message);
        }
    })
    .catch(error => console.error("Error replying to comment:", error));
}

// ✅ Function to Display a Comment
function displayComment(commentData) {
    let commentList = document.getElementById("commentList");
    let commentItem = document.createElement("div");
    commentItem.classList.add("comment-item");
    commentItem.setAttribute("data-id", commentData.id);

    commentItem.innerHTML = `
        <strong>${commentData.username}:</strong> <span class="comment-text">${commentData.commentText}</span>
        <button class="reply-btn" onclick="replyToComment(${commentData.id})">Reply</button>
        <div class="replies" id="replies-${commentData.id}"></div>
    `;

    if (commentData.parent_id) {
        let parentComment = document.getElementById(`replies-${commentData.parent_id}`);
        parentComment.appendChild(commentItem);
    } else {
        commentList.appendChild(commentItem);
    }
}

    </script>
